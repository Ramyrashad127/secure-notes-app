services:
  postgres:
    image: postgres:16.4-alpine
    container_name: secure-notes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secure_notes
      POSTGRES_PASSWORD: secure_notes
      POSTGRES_DB: secure_notes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_notes -d secure_notes"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2.5-alpine
    container_name: secure-notes-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.2
    container_name: secure-notes-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
    container_name: secure-notes-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://secure_notes:secure_notes@postgres:5432/secure_notes
      VALKEY_URL: redis://valkey:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: secure-notes-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo -n "$$METRICS_TOKEN" > /etc/prometheus/metrics_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle
    depends_on:
      - web

volumes:
  postgres_data:
  valkey_data:
  grafana_data: